[build-system]
requires = ["scikit-build-core>=1.1", "nanobind>=3.1"]
build-backend = "scikit_build_core.build"

[project]
name = "grace-runtime"
version = "0.1.0"
description = "Fast CPU and GPU inference of GRACE and PACE interatomic potentials with ASE, batching and TorchSim"
requires-python = ">=3.10"
license = { text = "Academic Software License (ASL); bundled third-party code: see THIRD_PARTY_NOTICES.md" }
classifiers = ["License :: Other/Proprietary License"]
dependencies = ["numpy", "ase", "tqdm", "spglib>=2.5"]

[project.scripts]
grace-runtime = "grace_runtime.cli:main"

[project.urls]
Homepage = "https://github.com/ICAMS/grace-runtime"
Issues = "https://github.com/ICAMS/grace-runtime/issues"

[project.optional-dependencies]
torchsim = ["torch>=2; python_version >= '3.12'", "torch-sim-atomistic>=0.6; python_version >= '3.12'"]
phonons = ["phonopy>=2.20"]
test = ["pytest", "pyyaml"]

[tool.scikit-build]
# pyproject at the repository root so the sdist carries libgrace/ and cmake/ next to python/
cmake.source-dir = "python"
wheel.packages = ["python/grace_runtime"]
# CPython >= 3.12: one abi3 wheel (nanobind STABLE_ABI); 3.10 / 3.11 get regular wheels
wheel.py-api = "cp312"
wheel.license-files = ["LICENSE.md", "THIRD_PARTY_NOTICES.md", "libgrace/third_party/grace_cnpy/LICENSE"]
cmake.build-type = "Release"
sdist.exclude = ["python-rocm6", "scripts", "internal", "ci", "knowledge", "AGENTS.md", "CLAUDE.md", ".gitlab-ci.yml"]
